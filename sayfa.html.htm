<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sürprizim Var!</title>
    <style>
        body {
            background-color: #050510;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* Tıklama İpucu */
        #hint {
            font-size: 18px;
            color: #ff758f;
            margin-bottom: 30px;
            text-align: center;
            animation: pulse 1.5s infinite;
            font-weight: 500;
            transition: opacity 0.5s ease;
        }

        /* Çiçek Kabı (Boyutlar ciddi oranda büyütüldü) */
        #flower-container {
            width: 300px;
            height: 300px;
            position: relative;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        #flower-container:active {
            transform: scale(0.95);
        }

        /* Çiçek Yaprakları */
        .petal {
            position: absolute;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #ff8da1, #ff3366);
            border-radius: 110px 0;
            top: 95px;
            left: 95px;
            transform-origin: 0px 0px;
            opacity: 0.8;
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.4);
            transition: all 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Tomurcuk Hali (İlk başta kapalı ve üst üste) */
        .petal1 { transform: rotate(0deg) scale(0.4); }
        .petal2 { transform: rotate(0deg) scale(0.4); }
        .petal3 { transform: rotate(0deg) scale(0.4); }
        .petal4 { transform: rotate(0deg) scale(0.4); }
        .petal5 { transform: rotate(0deg) scale(0.4); }

        /* Çiçek Açtığında Alacağı Pozisyonlar (Aktif Sınıfı) */
        .opened .petal {
            border-radius: 50% 50% 0 50%;
            opacity: 1;
        }
        .opened .petal1 { transform: rotate(0deg) scale(1.1); }
        .opened .petal2 { transform: rotate(72deg) scale(1.1); }
        .opened .petal3 { transform: rotate(144deg) scale(1.1); }
        .opened .petal4 { transform: rotate(216deg) scale(1.1); }
        .opened .petal5 { transform: rotate(288deg) scale(1.1); }

        /* Çiçeğin Ortası */
        .center {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #fff3d1, #ffb703);
            border-radius: 50%;
            top: 115px;
            left: 115px;
            opacity: 0.9;
            box-shadow: 0 0 30px #ffb703;
            transition: all 1.5s ease;
            transform: scale(0.3);
        }

        .opened .center {
            transform: scale(1);
            box-shadow: 0 0 40px #ffb703, 0 0 70px #ffb703;
        }

        /* Seni Seviyorum Yazısı (Daha büyük ve parıltılı) */
        #text {
            margin-top: 50px;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 3px;
            opacity: 0;
            text-align: center;
            transition: all 2s ease;
            transform: translateY(20px);
            text-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
            z-index: 10;
        }

        #text.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Havai Fişek Tuvali */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* İpucu Yanıp Sönme Animasyonu */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div id="hint">Dokun ve Çiçeği Açtır ✨</div>

    <div id="flower-container" onclick="bloomFlower()">
        <div class="petal petal1"></div>
        <div class="petal petal2"></div>
        <div class="petal petal3"></div>
        <div class="petal petal4"></div>
        <div class="petal petal5"></div>
        <div class="center"></div>
    </div>

    <div id="text">Seni Seviyorum ❤️</div>

    <script>
        let hasBloomed = false;

        function bloomFlower() {
            if (hasBloomed) return;
            hasBloomed = true;

            // İpucunu gizle
            document.getElementById('hint').style.opacity = '0';

            // Çiçeği açtır
            document.getElementById('flower-container').classList.add('opened');

            // Yazıyı göster
            setTimeout(() => {
                document.getElementById('text').classList.add('show');
            }, 1500);

            // Havai fişekleri başlat
            startFireworks();
        }

        // --- HAVAİ FİŞEK SİSTEMİ (Canvas) ---
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.y += 0.05; // Yerçekimi etkisi
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }

        let particles = [];
        const colors = ['#ff3366', '#ffb703', '#00f5d4', '#7b2cbf', '#9ef01a', '#ff9f1c'];

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.6); // Ekranın üst yarısında patlasınlar
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.2)'; // Kuyruklu efekt için hafif temizleme
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                    particle.draw();
                }
            });

            requestAnimationFrame(animate);
        }

        function startFireworks() {
            animate();
            // Sürekli havai fişek patlat
            setInterval(() => {
                createFirework();
            }, 600);
        }
    </script>
</body>
</html>
